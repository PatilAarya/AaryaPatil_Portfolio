<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aarya Patil</title>
    <meta name="description" content="Aarya Patil, a full-stack developer from Pune. Selected work, internship experience, and a guestbook you can sign." />
    <meta property="og:title" content="Aarya Patil" />
    <meta property="og:description" content="Projects, experience, and a margin you can scribble in." />
    <meta name="theme-color" content="#faf5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0506" media="(prefers-color-scheme: dark)" />
    <link id="favicon" rel="icon" type="image/png" href="/logo-mark-dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'paper' && t !== 'ink')
          t = 'ink';
        document.documentElement.dataset.theme = t;
        document.getElementById('favicon').href = t === 'ink' ? '/logo-mark-dark.png' : '/logo-mark-light.png';
      } catch (e) {
        document.documentElement.dataset.theme = 'ink';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
